name: Compilar Plugin Ember

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Compilar Plugin
      run: cmake --build build --config Release

    - name: Guardar Plugins Compilados
      uses: actions/upload-artifact@v4
      with:
        name: Ember-macOS-Build
        path: |
          build/Ember_artefacts/Release/
          build/Ember_artefacts/
          build/
